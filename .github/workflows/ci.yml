name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: VERSION matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION is X.Y.Z and (for a release) matches the tag
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION '$v' is not X.Y.Z"; exit 1; }
          if [ "$IS_TAG" = true ] && [ "$REF_NAME" != "v$v" ]; then
            echo "Tag $REF_NAME does not match VERSION $v"; exit 1
          fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: Android
      - run: cp Android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/scripture-surprise-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-surprise-apk
          path: ${{ runner.temp }}/scripture-surprise-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Remove all previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' |
            while read -r old; do
              [ "$old" = "$TAG" ] && continue
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
          # Re-running a tag build replaces its own release too
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/scripture-surprise-debug.apk "scripture-surprise-$TAG-debug.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Scripture Surprise $TAG" --generate-notes \
            "scripture-surprise-$TAG-debug.apk#Scripture Surprise (Android debug APK)"
